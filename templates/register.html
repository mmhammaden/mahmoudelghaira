{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="card">
    <h2>Register</h2>
    <form method="POST">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" required>

        <label for="phone">Phone number</label>
        <input type="text" id="phone" name="phone" value="{{ phone or '' }}"
               placeholder="رقم الهاتف" required>
        <p class="small-note">No verification is performed on the phone number.</p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <p class="small-note">Simple password (at least 6 characters).</p>

        <label for="class_id">Class</label>
        <select id="class_id" name="class_id" required>
            <option value="">Select a class</option>
            {% for c in classes %}
                <option value="{{ c.id }}" {% if class_id and class_id|string == c.id|string %}selected{% endif %}>
                    {{ c.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit" class="btn primary">Register</button>
    </form>
    <p class="small-note">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
