<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإدارة Dashboard - Ghaira</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="dashboard.html" class="brand">Ghaira</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>
  <h2>الإدارة Dashboard</h2>

  <div class="stat-row" id="stats"></div>

  <div class="card">
    <h2>Recent النتائج</h2>
    <table id="recentTable">
      <thead><tr><th>الطالب</th><th>الصف</th><th>التمرين</th><th>النتيجة</th><th>تاريخ الإرسال</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let profile;
async function init() {
  profile = await requireAuth(true);
  if (!profile) return;
  await buildNavbar();
  await loadStats();
  await loadRecent();
}

async function loadStats() {
  const container = document.getElementById('stats');
  const [sRes, cRes, eRes, rRes] = await Promise.all([
    supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'student'),
    supabase.from('classes').select('*', { count: 'exact', head: true }),
    supabase.from('exercises').select('*', { count: 'exact', head: true }),
    supabase.from('results').select('*', { count: 'exact', head: true })
  ]);
  container.innerHTML = `
    <div class="stat"><div class="value">${sRes.count}</div><div class="label">الطلاب</div></div>
    <div class="stat"><div class="value">${cRes.count}</div><div class="label">الصفes</div></div>
    <div class="stat"><div class="value">${eRes.count}</div><div class="label">البرامج</div></div>
    <div class="stat"><div class="value">${rRes.count}</div><div class="label">النتائج</div></div>
  `;
}

async function loadRecent() {
  const { data, error } = await supabase
    .from('results')
    .select(`exercise_id, submitted_at, score, total,
      profiles ( name, class_id, classes ( name ) )
    `)
    .order('submitted_at', { ascending: false })
    .limit(10);
  if (error) { showAlert(error.message, 'error'); return; }

  const tbody = document.querySelector('#recentTable tbody');
  tbody.innerHTML = data.map(r => {
    const cls = escapeHtml(r.profiles?.classes?.name) || '-';
    return `<tr>
      <td>${escapeHtml(r.profiles?.name)}</td>
      <td>${cls}</td>
      <td>التمرين #${r.exercise_id}</td>
      <td>${escapeHtml(r.score)} / ${escapeHtml(r.total)}</td>
      <td>${escapeHtml(formatDate(r.submitted_at))}</td>
    </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
