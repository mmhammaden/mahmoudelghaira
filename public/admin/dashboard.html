<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم للمدير – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ التحميل...</span>
  </div>

  <div id="dashboardContent" style="display:none;">
    <h2>لوحة التحكم للمدير</h2>

    <div class="stat-row" id="stats">
      <div class="stat"><div class="value">0</div><div class="label">الطلاب</div></div>
      <div class="stat"><div class="value">0</div><div class="label">الصفوف</div></div>
      <div class="stat"><div class="value">0</div><div class="label">التمارين</div></div>
      <div class="stat"><div class="value">0</div><div class="label">النتائج</div></div>
    </div>

    <div class="card">
      <h2>أحدث النتائج</h2>
      <table id="recentTable">
        <thead>
          <tr><th>الطالب</th><th>الصف</th><th>التمرين</th><th>النتيجة</th><th>تاريخ الإرسال</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<footer class="footer">
  ثانوية الغايرة &mdash; جميع الحقوق محفوظة.
</footer>

<script>
let profile;

async function init() {
  profile = await requireAuth(true);
  if (!profile) return;
  await buildNavbar();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('dashboardContent').style.display = 'block';
  await loadStats();
  await loadRecent();
}

async function loadStats() {
  const [sRes, cRes, eRes, rRes] = await Promise.all([
    supabase.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'student'),
    supabase.from('classes').select('*', { count: 'exact', head: true }),
    supabase.from('exercises').select('*', { count: 'exact', head: true }),
    supabase.from('results').select('*', { count: 'exact', head: true })
  ]);

  document.querySelectorAll('.stat .value')[0].textContent = sRes.count ?? 0;
  document.querySelectorAll('.stat .value')[1].textContent = cRes.count ?? 0;
  document.querySelectorAll('.stat .value')[2].textContent = eRes.count ?? 0;
  document.querySelectorAll('.stat .value')[3].textContent = rRes.count ?? 0;
}

async function loadRecent() {
  const { data, error } = await supabase
    .from('results')
    .select(`exercise_id, submitted_at, score, total,
      profiles ( name, class_id, classes ( name ) )
    `)
    .order('submitted_at', { ascending: false })
    .limit(10);

  if (error) { showAlert(translateError(error.message), 'error'); return; }

  const tbody = document.querySelector('#recentTable tbody');
  tbody.innerHTML = (data || []).map(r => {
    const cls = escapeHtml(r.profiles?.classes?.name) || '-';
    return `<tr>
      <td>${escapeHtml(r.profiles?.name)}</td>
      <td>${cls}</td>
      <td>التمرين #${r.exercise_id}</td>
      <td>${escapeHtml(r.score)} / ${escapeHtml(r.total)}</td>
      <td>${escapeHtml(formatDate(r.submitted_at))}</td>
    </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
