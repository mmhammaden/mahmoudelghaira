<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البرامج - Ghaira</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="dashboard.html" class="brand">Ghaira</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>
  <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
    <h2>البرامج &amp; التمارين</h2>
    <a href="program-form.html" class="btn btn-primary">+ إضافة تمرين</a>
  </div>

  <table id="programsTable">
    <thead><tr><th>العنوان</th><th>الصف</th><th>الإجابة الصحيحة</th><th>الإجراءات</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
let profile;
async function init() {
  profile = await requireAuth(true);
  if (!profile) return;
  await buildNavbar();
  await loadالبرامج();
}

async function loadالبرامج() {
  const { data, error } = await supabase
    .from('exercises')
    .select('*, classes ( name )')
    .order('id', { ascending: false });
  if (error) { showAlert(error.message, 'error'); return; }

  const tbody = document.querySelector('#programsTable tbody');
  tbody.innerHTML = data.map(e => `
    <tr>
      <td>${escapeHtml(e.title)}</td>
      <td>${escapeHtml(e.classes?.name) || '-'}</td>
      <td>${escapeHtml(e.correct_answer)}</td>
      <td>
        <a href="/admin/program-form.html?id=${e.id}" class="btn btn-small btn-ghost">تعديل</a>
        <button class="btn btn-small btn-danger" onclick="deleteالتمرين(${e.id})">حذف</button>
      </td>
    </tr>
  `).join('');
}

async function deleteالتمرين(id) {
  if (!confirm('حذف this exercise?')) return;
  await supabase.from('results').delete().eq('exercise_id', id);
  await supabase.from('exercises').delete().eq('id', id);
  await loadالبرامج();
}

init();
</script>
</body>
</html>
