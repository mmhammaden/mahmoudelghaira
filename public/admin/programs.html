<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التمارين – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل التمارين...</span>
  </div>

  <div id="programsContent" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
      <h2>التمارين</h2>
      <a href="program-form.html" class="btn btn-primary">+ إضافة تمرين</a>
    </div>

    <table id="programsTable">
      <thead>
        <tr><th>العنوان</th><th>الصف</th><th>الإجابة الصحيحة</th><th>الإجراءات</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<footer class="footer">
  ثانوية الغايرة &mdash; جميع الحقوق محفوظة.
</footer>

<script>
let profile;

async function init() {
  profile = await requireAuth(true);
  if (!profile) return;
  await buildNavbar();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('programsContent').style.display = 'block';
  await loadPrograms();
}

async function loadPrograms() {
  const { data, error } = await supabase
    .from('exercises')
    .select('*, classes ( name )')
    .order('id', { ascending: false });

  if (error) { showAlert(translateError(error.message), 'error'); return; }

  const tbody = document.querySelector('#programsTable tbody');
  tbody.innerHTML = (data || []).map(e => `
    <tr>
      <td>${escapeHtml(e.title)}</td>
      <td>${escapeHtml(e.classes?.name || '-')}</td>
      <td>${escapeHtml(e.correct_answer)}</td>
      <td>
        <a href="program-form.html?id=${e.id}" class="btn btn-ghost btn-sm">تعديل</a>
        <button class="btn btn-danger btn-sm" onclick="deleteExercise(${e.id})">حذف</button>
      </td>
    </tr>
  `).join('');
}

async function deleteExercise(id) {
  if (!confirm('هل أنت متأكد من حذف هذا التمرين؟')) return;
  const { error } = await supabase.from('results').delete().eq('exercise_id', id);
  if (error) { showAlert(translateError(error.message), 'error'); return; }
  const { error: err2 } = await supabase.from('exercises').delete().eq('id', id);
  if (err2) { showAlert(translateError(err2.message), 'error'); return; }
  await loadPrograms();
}

init();
</script>
</body>
</html>
