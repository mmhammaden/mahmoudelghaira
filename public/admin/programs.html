<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التمارين – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل التمارين...</span>
  </div>

  <div id="programsContent" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; flex-wrap:wrap;">
      <h2>التمارين</h2>
      <a href="program-form.html" class="btn btn-primary">+ إضافة تمرين</a>
    </div>

    <table id="programsTable">
      <thead>
        <tr><th>العنوان</th><th>الصف</th><th>الفصل</th><th>الإجابة الصحيحة</th><th>الإجراءات</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<footer class="footer">
  ثانوية الغايرة &mdash; جميع الحقوق محفوظة.
</footer>

<script>
let profile;

async function init() {
  profile = await requireAuth(true);
  if (!profile) return;
  await buildNavbar();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('programsContent').style.display = 'block';
  await loadPrograms();
}

async function loadPrograms() {
  try {
    const data = await apiGet('/api/admin/exercises');
    const exercises = data.exercises || [];

    const tbody = document.querySelector('#programsTable tbody');
    tbody.innerHTML = (exercises || []).map(e => `
      <tr>
        <td>${escapeHtml(e.title)}</td>
        <td>${escapeHtml(e.class_name || '-')}</td>
        <td>${escapeHtml(e.chapter_title || '-')}</td>
        <td>${escapeHtml(e.correct_answer)}</td>
        <td>
          <a href="program-form.html?id=${e.id}" class="btn btn-ghost btn-sm">تعديل</a>
          <button class="btn btn-danger btn-sm" onclick="deleteExercise(${e.id})">حذف</button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    showAlert(err.message, 'error');
  }
}

async function deleteExercise(id) {
  if (!confirm('هل أنت متأكد من حذف هذا التمرين؟')) return;
  try {
    await apiDelete('/api/admin/exercises/' + id);
    await loadPrograms();
  } catch (err) {
    showAlert(err.message, 'error');
  }
}

init();
</script>
</body>
</html>
