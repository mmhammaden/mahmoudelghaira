<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداء التمرين – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="/index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</div>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل التمرين...</span>
  </div>

  <div id="takeContent" class="take-shell" style="display:none;">
    <div class="take-topline">
      <span id="chapterName">الفصل</span>
      <a href="/student/exercises.html" id="cancelLink" class="lesson-back">← فصولي</a>
    </div>
    <div class="math-paper">
      <form id="answerForm">
        <span class="lesson-kicker">Exercice</span>
        <h1 id="exTitle">التمرين</h1>
        <p id="exQuestion" class="math-question" dir="ltr"></p>
        <p class="answer-instruction">Choisis la bonne réponse :</p>
        <div class="answer-grid" dir="ltr">
          <label class="answer-choice"><input type="radio" name="answer" value="A" required><span class="answer-letter">A</span><span id="optA"></span></label>
          <label class="answer-choice"><input type="radio" name="answer" value="B"><span class="answer-letter">B</span><span id="optB"></span></label>
          <label class="answer-choice"><input type="radio" name="answer" value="C"><span class="answer-letter">C</span><span id="optC"></span></label>
          <label class="answer-choice"><input type="radio" name="answer" value="D"><span class="answer-letter">D</span><span id="optD"></span></label>
        </div>
        <p class="score-counter">النقاط: <span id="score">0</span>/<span id="total">0</span></p>
        <button type="submit" class="btn btn-primary btn-block math-submit" id="submitBtn">Valider ma réponse</button>
      </form>
    </div>
  </div>
</div>

<footer class="footer">ثانوية الغايرة &mdash; جميع الحقوق محفوظة.</footer>

<script>
let profile, exerciseId = null;
const urlParams = new URLSearchParams(window.location.search);
exerciseId = urlParams.get('id');

async function init() {
  profile = await requireAuth();
  if (!profile) return;
  
  await buildNavbar(profile);

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('takeContent').style.display = 'block';
  await loadExercise();
}

async function loadExercise() {
  if (exerciseId) {
    try {
      var exData = await apiGet('/api/exercises/' + exerciseId);
      var exercise = exData.exercise || {};
      document.getElementById('exTitle').textContent = exercise.title || '';
      document.getElementById('exQuestion').innerHTML = exercise.question || '';
      document.getElementById('optA').textContent = exercise.option_a || '';
      document.getElementById('optB').textContent = exercise.option_b || '';
      document.getElementById('optC').textContent = exercise.option_c || '';
      document.getElementById('optD').textContent = exercise.option_d || '';
    } catch (err) { showAlert(err.message, 'error'); }
  }

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('takeContent').style.display = 'block';
}

document.getElementById('answerForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var form = this;
  var answer = form.elements['answer'].value;
  var exId = exerciseId;
  apiPost('/api/exercises/' + exerciseId + '/submit', { answer: answer }).then(function(data) {
    showAlert(data.ok ? 'Terminé avec succès !' : data.error || 'Erreur', data.ok ? 'success' : 'error');
    if (data.ok) {
      setTimeout(function() { window.location.href = '/student/exercises.html'; }, 1500);
    }
  }).catch(function(err) { showAlert(err.message, 'error'); });
});
</script>
</body>
</html>
