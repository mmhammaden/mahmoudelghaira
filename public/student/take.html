<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداء التمرين – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل التمرين...</span>
  </div>

  <div id="takeContent" style="display:none;">
    <h2 id="exTitle">التمرين</h2>
    <div class="card">
      <form id="answerForm">
        <p id="exQuestion"></p>
        <div class="field-group">
          <label><input type="radio" name="answer" value="A" required> <span id="optA"></span></label>
        </div>
        <div class="field-group">
          <label><input type="radio" name="answer" value="B"> <span id="optB"></span></label>
        </div>
        <div class="field-group">
          <label><input type="radio" name="answer" value="C"> <span id="optC"></span></label>
        </div>
        <div class="field-group">
          <label><input type="radio" name="answer" value="D"> <span id="optD"></span></label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">إرسال الإجابة</button>
        <a href="/student/exercises.html" class="btn btn-ghost btn-block mt-1">إلغاء</a>
      </form>
    </div>
  </div>
</div>

<footer class="footer">
  ثانوية الغايرة &mdash; جميع الحقوق محفوظة.
</footer>

<script>
let profile, exerciseId = null;
const urlParams = new URLSearchParams(window.location.search);
exerciseId = urlParams.get('id');

async function init() {
  profile = await requireAuth();
  if (!profile) return;
  await buildNavbar();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('takeContent').style.display = 'block';
  await loadExercise();
}

async function loadExercise() {
  const { data, error } = await supabase
    .from('exercises')
    .select('*, classes ( name )')
    .eq('id', parseInt(exerciseId))
    .eq('class_id', profile.class_id)
    .single();

  if (error || !data) {
    document.getElementById('alert-box').innerHTML = '<div class="alert alert-error" role="alert">التمرين غير موجود أو غير متوفر لصفك.</div>';
    return;
  }

  document.getElementById('exTitle').textContent = data.title;
  document.getElementById('exQuestion').textContent = data.question;
  document.getElementById('optA').textContent = data.option_a;
  document.getElementById('optB').textContent = data.option_b;
  document.getElementById('optC').textContent = data.option_c;
  document.getElementById('optD').textContent = data.option_d;
  window.exerciseData = data;
}

document.getElementById('answerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alert-box');
  const btn = document.getElementById('submitBtn');
  const answer = document.querySelector('input[name="answer"]:checked').value;
  const data = window.exerciseData;
  const correct = answer === data.correct_answer ? 1 : 0;

  box.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'جارٍ الحفظ...';

  const { error } = await supabase.from('results').insert({
    user_id: profile.id,
    exercise_id: data.id,
    score: correct,
    total: 1
  });

  if (error) {
    box.innerHTML = '<div class="alert alert-error" role="alert">' + escapeHtml(translateError(error.message)) + '</div>';
    btn.disabled = false;
    btn.textContent = 'إرسال الإجابة';
    return;
  }

  box.innerHTML = '<div class="alert alert-success" role="alert">تم حفظ النتيجة! إجابتك ' + (correct ? 'صحيحة.' : 'غير صحيحة.') + '</div>';
  setTimeout(() => { window.location.href = '/student/exercises.html'; }, 1500);
});

init();
</script>
</body>
</html>
