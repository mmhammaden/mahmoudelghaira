<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداء التمرين – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
</head>
<body class="student-learning-page">

<div class="cmath-shell">
<aside class="cmath-sidebar">
  <div class="cmath-ad-space" aria-hidden="true"></div>
  <div class="cmath-user-box"><div class="cmath-user-name" id="sideStudentName">Élève</div><div class="cmath-score">Exercice en cours</div></div>
  <nav class="cmath-side-menu" aria-label="Menu élève">
    <a href="/student/exercises.html" class="active">Exercices</a>
    <a href="/student/results.html">Bilan</a>
    <button type="button" onclick="signOut()">Déconnexion</button>
  </nav>
  <div class="cmath-keys"><span>√</span><span>^</span><span>←</span><span>CE</span><span>+</span><span>7</span><span>8</span><span>9</span><span>−</span><span>4</span><span>5</span><span>6</span><span>×</span><span>1</span><span>2</span><span>3</span><span>÷</span><span>0</span><span>±</span><span>=</span></div></div>
</aside>
<main class="cmath-main">
  <header class="cmath-header">
  <div class="cmath-logo">ثانوية الغايرة</div>
</header>
    <div class="cmath-logo"><span class="c-blue">A</span><span class="c-red">p</span><span class="c-orange">p</span><span class="c-green">r</span><span class="c-blue">e</span><span class="c-orange">n</span><span class="c-green">d</span><span class="c-red">r</span><span class="c-blue">e</span><b> les maths</b><span class="c-green">!</span></div>
    <div class="cmath-levels"><span>6ème</span><span>5ème</span><span>4ème</span><span>3ème</span><span class="active">2AS</span><span>3AS</span><span>4AS</span><span>5D</span><span>6A</span></div>
  </header>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل التمرين...</span>
  </div>

  <div id="takeContent" class="take-shell" style="display:none;">
    <div class="take-topline">
      <span>2AS · Mathématiques</span>
      <a href="/student/exercises.html" id="cancelLink" class="lesson-back">← Retour au chapitre</a>
    </div>
    <div class="math-paper">
      <form id="answerForm">
        <span class="lesson-kicker">Exercice</span>
        <h1 id="exTitle">التمرين</h1>
        <p id="exQuestion" class="math-question" dir="ltr"></p>
        <p class="answer-instruction">Choisis la bonne réponse :</p>
        <div class="answer-grid" dir="ltr">
          <label class="answer-choice"><input type="radio" name="answer" value="A" required><span class="answer-letter">A</span><span id="optA"></span></label>
          <label class="answer-choice"><input type="radio" name="answer" value="B"><span class="answer-letter">B</span><span id="optB"></span></label>
          <label class="answer-choice"><input type="radio" name="answer" value="C"><span class="answer-letter">C</span><span id="optC"></span></label>
          <label class="answer-choice"><input type="radio" name="answer" value="D"><span class="answer-letter">D</span><span id="optD"></span></label>
        </div>
        <button type="submit" class="btn btn-primary btn-block math-submit" id="submitBtn">Valider ma réponse</button>
      </form>
    </div>
  </div>
</div>
</main>
</div>


<script>
let profile, exerciseId = null;
const urlParams = new URLSearchParams(window.location.search);
exerciseId = urlParams.get('id');

async function init() {
  profile = await requireAuth();
  if (!profile) return;
  document.getElementById('sideStudentName').textContent = profile.name || 'Élève';
  await buildNavbar(profile);

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('takeContent').style.display = 'block';
  await loadExercise();
}

async function loadExercise() {
  try {
    const data = await apiGet('/api/exercises/' + exerciseId);

    document.getElementById('exTitle').textContent = data.title;
    document.getElementById('exQuestion').textContent = data.question;
    document.getElementById('optA').textContent = data.option_a;
    document.getElementById('optB').textContent = data.option_b;
    document.getElementById('optC').textContent = data.option_c;
    document.getElementById('optD').textContent = data.option_d;
    if (data.chapter_id) {
      document.getElementById('cancelLink').href = '/student/exercises.html?chapter_id=' + data.chapter_id;
    }
    window.exerciseData = data;
  } catch (err) {
    document.getElementById('alert-box').innerHTML = '<div class="alert alert-error" role="alert">' + escapeHtml(err.message) + '</div>';
  }
}

document.getElementById('answerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alert-box');
  const btn = document.getElementById('submitBtn');
  const answer = document.querySelector('input[name="answer"]:checked').value;

  box.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'جارٍ الحفظ...';

  try {
    const result = await apiPost('/api/exercises/' + exerciseId + '/submit', { answer: answer });

    box.innerHTML = '<div class="alert alert-success" role="alert">تم حفظ النتيجة! إجابتك ' + (result.correct ? 'صحيحة.' : 'غير صحيحة.') + '</div>';
    const returnUrl = window.exerciseData?.chapter_id
      ? '/student/exercises.html?chapter_id=' + window.exerciseData.chapter_id
      : '/student/exercises.html';
    setTimeout(() => { window.location.href = returnUrl; }, 1500);
  } catch (err) {
    box.innerHTML = '<div class="alert alert-error" role="alert">' + escapeHtml(err.message) + '</div>';
    btn.disabled = false;
    btn.textContent = 'إرسال الإجابة';
  }
});

init();
</script>
</body>
</html>
