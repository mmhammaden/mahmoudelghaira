<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماريني - Ghaira</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="/dashboard.html" class="brand">Ghaira</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>
  <h2>تماريني</h2>
  <p class="small-note">Do the exercises below. النتائج are saved automatically.</p>
  <div id="exercisesList"></div>
</div>

<script>
let profile;
async function init() {
  profile = await requireAuth();
  if (!profile) return;
  await buildNavbar();
  await loadالتمارين();
}

async function loadالتمارين() {
  const { data, error } = await supabase
    .from('exercises')
    .select(`*, classes ( name )`)
    .eq('class_id', profile.class_id)
    .order('id', { ascending: false });
  if (error) { showAlert(error.message, 'error'); return; }

  // Load existing results for this user
  const { data: results } = await supabase
    .from('results')
    .select('exercise_id')
    .eq('user_id', profile.id);
  const doneIds = new Set((results || []).map(r => r.exercise_id));

  const container = document.getElementById('exercisesList');
  if ((data || []).length === 0) {
    container.innerHTML = '<p class="small-note">لا توجد تمارين متاحة لصفك بعد.</p>';
    return;
  }

  container.innerHTML = (data || []).map(e => `
    <div class="exercise">
      <h3>${escapeHtml(e.title)}</h3>
      <p>${escapeHtml(e.question)}</p>
      ${doneIds.has(e.id) ?
        '<span class="done">&#10003; Completed</span>' :
        '<a href="/student/take.html?id=' + escapeHtml(e.id) + '" class="btn btn-primary btn-small">Start exercise</a>'
      }
    </div>
  `).join('');
}

init();
</script>
</body>
</html>
