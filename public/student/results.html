<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائجتي – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="/index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</div>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل النتائج...</span>
  </div>

  <div id="resultsContent" style="display:none;">
    <h2>نتائجتي</h2>
    <p class="small-note">نتائج التمارين التي قمت بأدائها. يمكن للمدير عرضها حسب الطالب أو حسب الصف.</p>

    <table id="resultsTable">
      <thead>
        <tr><th>التمرين</th><th>النتيجة</th><th>تاريخ الإرسال</th></tr>
      </tbody>
      <tbody>
        ${(function() {
          // This will be populated by JavaScript
          return '<tr><td colspan="3" style="text-align:center;">لا توجد نتائج بعد</td></tr>'
        })()}
      </tbody>
    </table>
  </div>
</div>

<footer class="footer">ثانوية الغايرة &mdash; جميع الحقوق محفوظة.</footer>

<script>
let profile;

async function init() {
  profile = await requireAuth();
  if (!profile) return;
  await buildNavbar(profile);
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('resultsContent').style.display = 'block';
  await loadResults();
}

async function loadResults() {
  try {
    const resData = await apiGet('/api/results');
    var results = resData.results || [];
  } catch (err) { showAlert(err.message, 'error'); return; }

  var tableBody = document.querySelector('#resultsTable tbody');
  tableBody.innerHTML = '';

  if (!results.length) {
    tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">لا توجد نتائج بعد</td></tr>';
    return;
  }

  results.forEach(function(r) {
    var row = document.createElement('tr');
    row.innerHTML = '<td>' + r.exercise_title + '</td>' +
                    '<td>' + (r.score ? r.score + '/' + r.total : 'Non Noté') + '</td>' +
                    '<td>' + r.submitted_at + '</td>';
    tableBody.appendChild(row);
  });
}

init();
</script>
</body>
</html>
