<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائجتي – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل النتائج...</span>
  </div>

  <div id="resultsContent" style="display:none;">
    <h2>نتائجتي</h2>
    <p class="small-note">نتائج التمارين التي قمت بأدائها. يمكن للمدير عرضها حسب الطالب أو حسب الصف.</p>

    <table id="resultsTable">
      <thead>
        <tr><th>التمرين</th><th>النتيجة</th><th>تاريخ الإرسال</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<footer class="footer">
  ثانوية الغايرة &mdash; جميع الحقوق محفوظة.
</footer>

<script>
let profile;

async function init() {
  profile = await requireAuth();
  if (!profile) return;
  await buildNavbar();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('resultsContent').style.display = 'block';
  await loadResults();
}

async function loadResults() {
  const { data, error } = await supabase
    .from('results')
    .select('*, exercises ( title )')
    .eq('user_id', profile.id)
    .order('submitted_at', { ascending: false });

  if (error) { showAlert(translateError(error.message), 'error'); return; }

  const tbody = document.querySelector('#resultsTable tbody');
  if ((data || []).length === 0) {
    showEmpty('resultsTable', 'لا توجد نتائج بعد.', 'ابدأ بأداء التمارين لتظهر نتائجك هنا.');
    return;
  }

  // Calculate average
  const scores = data.map(r => r.score);
  const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : 0;

  tbody.innerHTML = (data || []).map(r => `
    <tr>
      <td>${escapeHtml(r.exercises?.title) || 'التمرين #' + escapeHtml(r.exercise_id)}</td>
      <td>${escapeHtml(r.score)} / ${escapeHtml(r.total)}</td>
      <td>${escapeHtml(formatDate(r.submitted_at))}</td>
    </tr>
  `).join('');
}

init();
</script>
</body>
</html>
