<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتائجتي – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
</head>
<body class="student-learning-page">

<div class="cmath-shell">
<aside class="cmath-sidebar">
  <div class="cmath-ad-space" aria-hidden="true"></div>
  <div class="cmath-user-box">
    <div class="cmath-user-name" id="sideStudentName">Élève</div>
    <div class="cmath-score">Score : <strong id="sideScore">0</strong></div>
  </div>
  <nav class="cmath-side-menu" aria-label="Menu élève">
    <a href="/student/exercises.html">Exercices</a>
    <a href="/student/results.html" class="active">Bilan</a>
    <button type="button" onclick="signOut()">Déconnexion</button>
  </nav>
  <div class="cmath-calculator" aria-hidden="true">
    <div class="cmath-screen">0</div>
    <div class="cmath-keys"><span>√</span><span>^</span><span>←</span><span>CE</span><span>+</span><span>7</span><span>8</span><span>9</span><span>−</span><span>4</span><span>5</span><span>6</span><span>×</span><span>1</span><span>2</span><span>3</span><span>÷</span><span>0</span><span>±</span><span>=</span></div>
  </div>
</aside>

<main class="cmath-main">
  <header class="cmath-header">
  <div class="cmath-logo">ثانوية الغايرة</div>
</header>
    <div class="cmath-logo" aria-label="Apprendre les maths">
      <span class="c-blue">A</span><span class="c-red">p</span><span class="c-orange">p</span><span class="c-green">r</span><span class="c-blue">e</span><span class="c-orange">n</span><span class="c-green">d</span><span class="c-red">r</span><span class="c-blue">e</span>
      <b> les maths</b><span class="c-green">!</span>
    </div>
    <div class="cmath-levels" aria-label="Niveaux">
      <span>6ème</span><span>5ème</span><span>4ème</span><span>3ème</span><span class="active">2AS</span><span>3AS</span><span>4AS</span><span>5D</span><span>6A</span>
    </div>
  </header>

<div class="container">
  <div id="alert-box"></div>

  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ تحميل النتائج...</span>
  </div>

  <div id="resultsContent" style="display:none;">
    <h2>نتائجتي</h2>
    <p class="small-note">نتائج التمارين التي قمت بأدائها. يمكن للمدير عرضها حسب الطالب أو حسب الصف.</p>

    <table id="resultsTable">
      <thead>
        <tr><th>التمرين</th><th>النتيجة</th><th>تاريخ الإرسال</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
</main>
</div>

<script>
let profile;

async function init() {
  profile = await requireAuth();
  if (!profile) return;
  document.getElementById('sideStudentName').textContent = profile.name || 'Élève';
  await buildNavbar(profile);

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('resultsContent').style.display = 'block';
  await loadResults();
}

async function loadResults() {
  try {
    const data = await apiGet('/api/results');
    const results = data.results || [];
    document.getElementById('sideScore').textContent = (results || []).reduce((sum, item) => sum + Number(item.score || 0), 0);

    const tbody = document.querySelector('#resultsTable tbody');
    if ((results || []).length === 0) {
      showEmpty('resultsTable', 'لا توجد نتائج بعد.', 'ابدأ بأداء التمارين لتظهر نتائجك هنا.');
      return;
    }

    // Calculate average
    const scores = results.map(r => r.score);
    const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : 0;

    tbody.innerHTML = (results || []).map(r => `
      <tr>
        <td>${escapeHtml(r.exercise_title) || 'التمرين #' + escapeHtml(r.id)}</td>
        <td>${escapeHtml(r.score)} / ${escapeHtml(r.total)}</td>
        <td>${escapeHtml(formatDate(r.submitted_at))}</td>
      </tr>
    `).join('');
  } catch (err) {
    showAlert(err.message, 'error');
  }
}

init();
</script>
</body>
</html>
