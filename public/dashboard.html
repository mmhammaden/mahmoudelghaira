<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم – ثانوية الغايرة</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links" id="navLinks"></div>
</nav>

<div class="container">
  <div id="alert-box"></div>
  <div class="loading-text" id="loadingState">
    <div class="loading"></div>
    <span>جارٍ التحميل...</span>
  </div>
  <div id="dashboardContent" style="display:none;">
    <h2>لوحة التحكم</h2>
    <p class="small-note">مرحباً، <span id="userName"></span>. اختر خياراً من القائمة أعلاه للمتابعة.</p>
  </div>
</div>

<script>
async function init() {
  const profile = await requireAuth();
  if (!profile) return;
  await buildNavbar();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('dashboardContent').style.display = 'block';
  document.getElementById('userName').textContent = profile.name;

  if (profile.role === 'admin') {
    window.location.href = '/admin/dashboard.html';
  } else {
    window.location.href = '/student/exercises.html';
  }
}

init();
</script>
</body>
</html>
