<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب – ثانوية الغايرة</title>
<link rel="stylesheet" href="js/common.css">
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="brand">ثانوية الغايرة</a>
  <div class="nav-links">
    <a href="index.html">الرئيسية</a>
    <a href="login.html">تسجيل الدخول</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h2>إنشاء حساب جديد</h2>
    <div id="alert-box"></div>
    <form id="registerForm">
      <label for="name">الاسم الكامل</label>
      <input type="text" id="name" name="name" placeholder="مثال: أحمد محمد علي" required>

      <label for="phone">رقم الهاتف</label>
      <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" placeholder="مثال: 31406022" required>
      <p class="small-note">رقم الهاتف مكون من 8 أرقام يبدأ بـ 2 أو 3 أو 4. لا يتم التحقق من ملكية الرقم.</p>

      <label for="password">كلمة المرور</label>
      <div class="field-group" style="position: relative;">
        <input type="password" id="password" name="password" required>
        <button type="button" id="togglePassword" class="btn btn-ghost btn-sm" style="position: absolute; left: 0.5rem; top: 2.2rem;">إظهار</button>
      </div>
      <p class="small-note">يجب ألا تقل كلمة المرور عن 6 أحرف.</p>

      <label for="class_id">الصف الدراسي</label>
      <select id="class_id" name="class_id" required>
        <option value="">اختر صفاً</option>
      </select>
      <p class="small-note">يُسمح للطلاب المسجلين فقط بإنشاء حساب.</p>

      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">إنشاء الحساب</button>
    </form>
    <p class="text-center small-note mt-2">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
  </div>
</div>

<footer class="footer">
  ثانوية الغايرة &mdash; جميع الحقوق محفوظة.
</footer>

<script>
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('password');
let showPassword = false;

togglePassword.addEventListener('click', () => {
  showPassword = !showPassword;
  passwordInput.type = showPassword ? 'text' : 'password';
  togglePassword.textContent = showPassword ? 'إخفاء' : 'إظهار';
});

const classSelect = document.getElementById('class_id');

async function loadClasses() {
  try {
    const data = await apiGet('/api/classes');
    classSelect.innerHTML = '<option value="">اختر صفاً</option>' +
      (data.classes || []).map(c => '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>').join('');
  } catch (err) {
    showAlert(err.message, 'error');
  }
}
loadClasses();

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alert-box');
  const btn = document.getElementById('registerBtn');
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const class_id = document.getElementById('class_id').value;

  box.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'جارٍ إنشاء الحساب...';

  if (!name) {
    box.innerHTML = '<div class="alert alert-error" role="alert">الرجاء إدخال الاسم الكامل.</div>';
    btn.disabled = false;
    btn.textContent = 'إنشاء الحساب';
    return;
  }
  if (!/^[234]\d{7}$/.test(phone)) {
    box.innerHTML = '<div class="alert alert-error" role="alert">رقم الهاتف غير صالح. يجب أن يكون 8 أرقام ويبدأ بـ 2 أو 3 أو 4.</div>';
    btn.disabled = false;
    btn.textContent = 'إنشاء الحساب';
    return;
  }
  if (!password || password.length < 6) {
    box.innerHTML = '<div class="alert alert-error" role="alert">يجب ألا تقل كلمة المرور عن 6 أحرف.</div>';
    btn.disabled = false;
    btn.textContent = 'إنشاء الحساب';
    return;
  }
  if (!class_id) {
    box.innerHTML = '<div class="alert alert-error" role="alert">الرجاء اختيار الصف.</div>';
    btn.disabled = false;
    btn.textContent = 'إنشاء الحساب';
    return;
  }

  try {
    await apiPost('/api/auth/register', {
      name, phone, password, class_id: Number(class_id)
    });

    box.innerHTML = '<div class="alert alert-success" role="alert">تم إنشاء الحساب بنجاح. يرجى تسجيل الدخول.</div>';
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  } catch (err) {
    box.innerHTML = '<div class="alert alert-error" role="alert">' + escapeHtml(translateError(err.message)) + '</div>';
    btn.disabled = false;
    btn.textContent = 'إنشاء الحساب';
  }
});
</script>
</body>
</html>
