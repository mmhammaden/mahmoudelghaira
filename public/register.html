<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل - Ghaira</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="login.html" class="brand">Ghaira</a>
  <div class="nav-links">
    <a href="login.html">تسجيل الدخول</a>
    <a href="register.html">التسجيل</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h2>التسجيل</h2>
    <div id="alert-box"></div>
    <form id="registerForm">
      <label for="name">الاسم الكامل</label>
      <input type="text" id="name" name="name" required>

      <label for="phone">رقم الهاتف</label>
      <input type="text" id="phone" name="phone" placeholder="رقم الهاتف" required>
      <p class="small-note">Format only — no verification of ownership.</p>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" required>
      <p class="small-note">Simple password (at least 6 characters).</p>

      <label for="class_id">الصف</label>
      <select id="class_id" name="class_id" required>
        <option value="">اختر صفاً</option>
      </select>

      <button type="submit" class="btn btn-primary">التسجيل</button>
    </form>
    <p class="small-note">Already have an account? <a href="login.html">تسجيل الدخول</a></p>
  </div>
</div>

<script>
const classSelect = document.getElementById('class_id');

async function loadالصفes() {
  const { data, error } = await supabase.from('classes').select('*').order('name');
  if (error) { showAlert(error.message, 'error'); return; }
  classSelect.innerHTML = '<option value="">اختر صفاً</option>' +
    data.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
}
loadالصفes();

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alert-box');
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const class_id = document.getElementById('class_id').value;

  const phoneRegex = /^[234]\d{7}$/;
  if (!name) { box.innerHTML = '<div class="alert alert-error">الاسم is required.</div>'; return; }
  if (!phoneRegex.test(phone)) { box.innerHTML = '<div class="alert alert-error">الهاتف must be 8 digits starting with 2, 3, or 4.</div>'; return; }
  if (!password || password.length < 6) { box.innerHTML = '<div class="alert alert-error">كلمة المرور must be at least 6 characters.</div>'; return; }
  if (!class_id) { box.innerHTML = '<div class="alert alert-error">Please select a class.</div>'; return; }

  // Sign up user in Supabase Auth
  const { data, error } = await supabase.auth.signUp({
    phone: phone,
    password: password,
    options: { data: { name: name, class_id: class_id, role: 'student' } }
  });

  if (error) {
    box.innerHTML = '<div class="alert alert-error">' + error.message + '</div>';
    return;
  }

  // Insert profile row
  if (data.user) {
    const { error: profileError } = await supabase.from('profiles').insert({
      id: data.user.id,
      name: name,
      phone: phone,
      role: 'student',
      class_id: parseInt(class_id)
    });
    if (profileError) {
      // Auth user was created but profile insert failed; surface the error
      // and do NOT redirect the user to a broken account.
      box.innerHTML = '<div class="alert alert-error">' + escapeHtml(profileError.message) + '</div>';
      return;
    }
  }

  box.innerHTML = '<div class="alert alert-success">Registration successful. Please log in.</div>';
  setTimeout(() => { window.location.href = 'login.html'; }, 1500);
});
</script>
</body>
</html>
