<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - Ghaira</title>
<link rel="stylesheet" href="../js/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</head>
<body>
<nav class="navbar">
  <a href="login.html" class="brand">Ghaira</a>
  <div class="nav-links">
    <a href="login.html">تسجيل الدخول</a>
    <a href="register.html">التسجيل</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h2>تسجيل الدخول</h2>
    <div id="alert-box"></div>
    <form id="loginForm">
      <label for="phone">رقم الهاتف</label>
      <input type="text" id="phone" name="phone" placeholder="رقم الهاتف" required>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
    </form>
    <p class="small-note">ليس لديك حساب؟ <a href="register.html">التسجيل هنا</a></p>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alert-box');
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await supabase.auth.signInWithPassword({ phone, password });
  if (error) {
    box.innerHTML = '<div class="alert alert-error">' + escapeHtml(error.message) + '</div>';
    return;
  }
  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
